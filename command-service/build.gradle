plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

dependencies {
    implementation project(":common-events")
    implementation project(":common-proto")                              // generated ToolServiceGrpc + messages
    implementation "net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE"  // @GrpcService auto-config
    implementation "net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE"  // @GrpcClient (ai-service AgentService)

    implementation "io.grpc:grpc-netty-shaded:1.68.1"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.kafka:spring-kafka"             // @KafkaListener consumers
    implementation "org.springframework.boot:spring-boot-starter-jdbc"
    runtimeOnly "org.postgresql:postgresql"
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.3.0'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    implementation "io.confluent:kafka-avro-serializer:7.8.0"           // KafkaAvroDeserializer

    implementation "org.springframework.boot:spring-boot-starter-data-redis"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "io.micrometer:micrometer-registry-prometheus"
    implementation "io.micrometer:micrometer-tracing-bridge-otel"
    implementation "io.opentelemetry:opentelemetry-exporter-otlp"
}