<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px;border:1px solid #e2e4e8">
  <p style="margin:0 0 4px;font-size:12px;letter-spacing:1px;color:#8a8f98">FLEETMIND ORDER UPDATE</p>
  <h2 style="margin:0 0 12px;color:#27ae60" th:text="'Order ' + ${orderId} + ' — ' + ${status}">Order — DELIVERED</h2>
  <table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:12px">
    <tr>
      <td style="padding:6px 0;color:#8a8f98;width:120px">Customer</td>
      <td style="padding:6px 0;color:#333" th:text="${customerName}">-</td>
    </tr>
    <tr>
      <td style="padding:6px 0;color:#8a8f98">Restaurant</td>
      <td style="padding:6px 0;color:#333" th:text="${restaurantName}">-</td>
    </tr>
    <tr>
      <td style="padding:6px 0;color:#8a8f98">Driver</td>
      <td style="padding:6px 0;color:#333" th:text="${driverId}">-</td>
    </tr>
    <tr>
      <td style="padding:6px 0;color:#8a8f98">SLA deadline</td>
      <td style="padding:6px 0;color:#333" th:text="${slaDeadline}">-</td>
    </tr>
  </table>
  <p style="margin:20px 0 0;font-size:12px;color:#b6bac1">Sent by the FleetMind notification service</p>
</div>
</body>
</html>
