<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px;border:1px solid #e2e4e8">
  <p style="margin:0 0 4px;font-size:12px;letter-spacing:1px;color:#8a8f98">FLEETMIND DISPATCH</p>
  <h2 style="margin:0 0 12px;color:#2b6cb0" th:text="${action} + ' · order ' + ${orderId}">REASSIGN · order</h2>
  <table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:12px">
    <tr>
      <td style="padding:6px 0;color:#8a8f98;width:120px">Action</td>
      <td style="padding:6px 0;color:#333" th:text="${action}">-</td>
    </tr>
    <tr>
      <td style="padding:6px 0;color:#8a8f98">Order</td>
      <td style="padding:6px 0;color:#333" th:text="${orderId}">-</td>
    </tr>
    <tr>
      <td style="padding:6px 0;color:#8a8f98">Target</td>
      <td style="padding:6px 0;color:#333" th:text="${targetId}">-</td>
    </tr>
    <tr>
      <td style="padding:6px 0;color:#8a8f98">Requested</td>
      <td style="padding:6px 0;color:#333" th:text="${requestedTs}">-</td>
    </tr>
  </table>
  <p style="margin:20px 0 0;font-size:12px;color:#b6bac1">Sent by the FleetMind notification service</p>
</div>
</body>
</html>
