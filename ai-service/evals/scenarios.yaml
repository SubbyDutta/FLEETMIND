  question: "order-6f6f2e2b is stuck with driver-3, two windows now. Move it."
  world:
    get_order_status:
      - found: true
        order_id: order-6f6f2e2b
        status: TO_PICKUP
        customer_name: "Tanmay Dutta"
        restaurant: "Trincas"
        assigned_driver: driver-3
        sla_deadline: "2026-08-28T13:12:00Z"
        promised_eta: "2026-08-28T12:58:00Z"
        current_eta: "2026-08-28T13:18:00Z"
        open_alerts:
          - type: STUCK
            severity: HIGH
            reason: "Driver moved only 7 meters in 8 minutes; second consecutive stuck window."
            created_at: "2026-08-28T12:56:00Z"
      - found: true
        order_id: order-6f6f2e2b
        status: TO_PICKUP
        customer_name: "Tanmay Dutta"
        restaurant: "Trincas"
        assigned_driver: driver-9
        sla_deadline: "2026-08-28T13:12:00Z"
        promised_eta: "2026-08-28T12:58:00Z"
        current_eta: "2026-08-28T13:08:00Z"
        open_alerts: []
    find_nearby_driver:
      - pickup: {lng: 88.3524, lat: 22.5535}
        drivers:
          - {driver_id: driver-4, name: "Vikram Singh", distance_meters: 380.1}
          - {driver_id: driver-9, name: "Farhan Sheikh", distance_meters: 744.9}
    reassign_order:
      - {success: false, error: "driver-4 is no longer IDLE — it was assigned a new order moments ago"}
      - {success: true, message: "order-6f6f2e2b reassigned to driver-9"}
  expect:
    must_call: [search_runbooks, find_nearby_driver, reassign_order]
    runbook_before_action: true
    min_calls: {reassign_order: 2}
    action_args:
      reassign_order: {order_id: order-6f6f2e2b, new_driver_id: driver-9, confirm: true}
  judge_rubric: >
    The first candidate (driver-4) went busy mid-flight; the answer must report
    that the agent fell back to the next candidate (driver-9) and succeeded —
    not report a failure, and not claim driver-4 got the order.

