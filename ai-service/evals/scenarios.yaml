# ─────────────────────────────────────────────────────────────────────────────
# B. DISPATCH — PROMPT-RULE REGRESSIONS (7)
# One scenario per numbered rule in DISPATCH_PROMPT; if a prompt edit breaks
# a rule, exactly one of these goes red and names it.
# ─────────────────────────────────────────────────────────────────────────────

- id: b1-busy-candidate-retry            # rule 4: on failed reassign, next candidate, retry once
