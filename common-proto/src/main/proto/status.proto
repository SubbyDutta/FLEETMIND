syntax = "proto3";

package fleetmind.status;

option java_package = "com.fleetmind.status";
option java_multiple_files = true;
import "google/protobuf/empty.proto";
service AgentDiagnostics{
  rpc Status(google.protobuf.Empty) returns(StatusResponse);
}

message StatusResponse{
  string model_name = 1;
  repeated string registered_tools=2;
  bool database_alive=3;


}