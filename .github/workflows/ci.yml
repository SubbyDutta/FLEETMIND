name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # command-service tests need the real schema (PostGIS + pgvector),
      # so run the same image docker-compose uses, init.sql and all
      - name: Start Postgres (project db image)
        run: |
          docker build -t fleetmind-db ./db
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_DB=fleetmind -e POSTGRES_PASSWORD=fleetmind \
            -v "$PWD/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro" \
            fleetmind-db
          until docker exec pg pg_isready -U postgres -d fleetmind >/dev/null 2>&1; do sleep 2; done
          sleep 5   # entrypoint restarts postgres once after init.sql — wait out the second boot

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & test all modules
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain
